spec_version = 2
features = ["intercom_auto_answer", "hotline", "multi_line", "line_keys", "blf", "directed_pickup", "voicemail_mwi", "multicast_paging", "ntp", "dst_rules", "vlan", "firmware", "device_credential", "directory", "key_transfer"]

[template]
key = "grandstream.base"
name = "Grandstream (common settings)"
version = "0.1.0"
manufacturer = "Grandstream"
abstract = true
firmware = "GRP261x 1.0.15.8, GRP260x 1.0.7.71, GXP21xx 1.0.11.106 and later"
status = "experimental"
description = """
Shared configuration for Grandstream GRP26xx and GXP21xx desk phones, as
P-value XML (cfg{mac}.xml): up to six accounts, the programmable keys (line,
BLF with the pickup prefix, speed dial, transfer, multicast paging),
voicemail indication, multicast paging listening, time and DST as a POSIX
rule, VLAN, firmware, the daily provisioning check with the device
credential, the Veyra CA, the phone directory, hotline and intercom
auto-answer. P-values from Grandstream's configuration templates
(docs/PROVISIONING_BREADTH.md §4.3). Not yet verified on hardware."""

[[files]]
name = "cfg{mac}.xml"
source = "cfg.xml.j2"
format = "xml"

[[variables]]
name = "sip_transport"
description = "SIP transport for the registrations (same values as the Poly and Yealink families)"
default = "UDPOnly"
pattern = "^(UDPOnly|TCPOnly|TLS|DNSnaptr)$"

[[variables]]
name = "registration_expires"
type = "integer"
description = "Registration interval in seconds (Grandstream counts minutes; rounded down, at least one)"
default = 300

[[variables]]
name = "admin_password"
description = "Web administrator password (blank keeps the factory default)"
sensitive = true
max_length = 32

[[variables]]
name = "polling_hour"
type = "integer"
description = "Hour (0-23) at which the phone checks for new configuration every day"
default = 3

[[variables]]
name = "directory_enabled"
type = "boolean"
description = "Download the organization's directory as the phone book"
default = true

[[variables]]
name = "intercom_auto_answer"
type = "boolean"
description = "Answer intercom calls automatically on the speaker (Veyra's intercom code sends the auto-answer header)"
default = true

[[variables]]
name = "intercom_mic_muted"
type = "boolean"
description = "Keep the microphone muted when an intercom call is answered automatically (not on GRP261x account 1)"
default = false

[[variables]]
name = "install_ca"
type = "boolean"
description = "Install the Veyra CA as a trusted certificate (needed before validating the server certificate)"
default = true

[[variables]]
name = "validate_server_certificate"
type = "boolean"
description = "Refuse a provisioning server whose certificate the phone does not trust (turn on once the CA is installed)"
default = false

[[variables]]
name = "dhcp_override"
type = "boolean"
description = "Let DHCP options 43/66 replace the provisioning server set here (off keeps the phone on Veyra over HTTPS)"
default = false
