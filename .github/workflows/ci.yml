name: CI

on:
  # Weekly dependency audit (docs/PRODUCTION_HARDENING.md §5): findings are
  # triaged within a week; a fix or a dated exception goes into SECURITY.md.
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs.
jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = Ubuntu 24.04 system Python, 3.14 = Ubuntu 26.04 system Python
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: veyra_ci
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyra_ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VEYRA_TEST_DATABASE_URL: postgresql+psycopg://veyra_ci:veyra_ci@127.0.0.1:5432/veyra_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: |
          ruff check veyra tests ../modules
          ruff format --check veyra tests ../modules
      - name: Type check (mypy)
        run: mypy
      - name: Type check bundled modules (mypy)
        run: |
          for d in ../modules/*/; do
            (cd "$d" && mypy --config-file ../../backend/pyproject.toml backend)
          done
      - name: Migrations match models
        env:
          VEYRA_ENV_FILE: /dev/null
          VEYRA_DATABASE_URL: postgresql+psycopg://veyra_ci:veyra_ci@127.0.0.1:5432/postgres
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  guides:
    name: Help guides
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Guides are valid and the built copy is current
        run: python3 tools/guides.py build --check
      - name: Every guide was reviewed after the features it covers changed
        run: python3 tools/guides.py stale
      - name: Pages without a guide (information)
        run: python3 tools/guides.py coverage

  installer:
    name: Installer scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR installer/*.sh installer/lib/*.sh installer/templates/*.sh
          shellcheck -x installer/tests/*.sh
      - name: Helper tests
        run: installer/tests/test_lib.sh
      - name: Preflight runs (read-only)
        run: installer/preflight.sh --json || test $? -le 2

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Python (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt
      - name: Node (npm audit, production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    # On pull requests the gitleaks action lists the PR's commits through
    # the API, which needs pull-requests: read on top of the workflow's
    # contents: read ("Resource not accessible by integration" otherwise).
    # Comments on the PR are off so that a read-only token (Dependabot) is
    # enough; findings still fail the job.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
