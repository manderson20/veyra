; Managed by Veyra installer
; Which Asterisk modules load (docs/TELEPHONY_ENGINE.md §2). Everything else
; autoloads as in the Ubuntu package; this file replaces the package sample,
; which is backed up beside it. Edit nothing here: it is overwritten on upgrade.
[modules]
autoload=yes
; Consoles and channel drivers Veyra does not use (the package's own list).
noload => pbx_gtkconsole.so
noload => pbx_kdeconsole.so
noload => app_intercom.so
noload => chan_modem.so
noload => chan_modem_aopen.so
noload => chan_modem_bestdata.so
noload => chan_modem_i4l.so
noload => chan_capi.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => cdr_sqlite.so
noload => app_directory_odbc.so
noload => res_config_odbc.so
noload => res_config_pgsql.so
load => res_musiconhold.so
; Only one voicemail backend may be loaded. Veyra uses app_voicemail.so (file
; storage); when the ODBC or IMAP variant also tries to load, it fails and on
; the way out unregisters the VoiceMail applications of the one that did load.
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
; RADIUS accounting is not configured; these only log warnings at start.
noload => cdr_radius.so
noload => cel_radius.so

[global]
